<!DOCTYPE html>
<html>
<head>
    <title>P&I Calculation Test</title>
</head>
<body>
    <h1>P&I Calculation Debug Test</h1>
    <div id="results"></div>
    
    <script>
        function validatePIPayment(userPayment, balance, rate, term) {
            console.log('Input values:', { userPayment, balance, rate, term });
            
            // Check for invalid inputs first
            if (!userPayment || !balance || !rate || !term || 
                userPayment <= 0 || balance <= 0 || rate <= 0 || term <= 0) {
                console.log('Invalid inputs detected');
                return {
                    calculatedPI: 0,
                    difference: 0,
                    percentDifference: 0,
                    isReasonable: true
                };
            }
            
            const monthlyRate = rate / 100 / 12;
            const numberOfPayments = term * 12;
            
            console.log('Calculated values:', { monthlyRate, numberOfPayments });
            
            // Check for edge cases that could cause division by zero
            if (monthlyRate <= 0 || numberOfPayments <= 0) {
                console.log('Edge case detected');
                return {
                    calculatedPI: 0,
                    difference: 0,
                    percentDifference: 0,
                    isReasonable: true
                };
            }
            
            const calculatedPI = balance * (monthlyRate * Math.pow(1 + monthlyRate, numberOfPayments)) / 
                                (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
            
            console.log('Calculated P&I:', calculatedPI);
            
            // Check if calculation resulted in a valid number
            if (!calculatedPI || calculatedPI <= 0 || !isFinite(calculatedPI)) {
                console.log('Invalid calculation result');
                return {
                    calculatedPI: 0,
                    difference: 0,
                    percentDifference: 0,
                    isReasonable: true
                };
            }
            
            const difference = Math.abs(userPayment - calculatedPI);
            const percentDifference = (difference / calculatedPI) * 100;
            
            return {
                calculatedPI,
                difference,
                percentDifference,
                isReasonable: percentDifference < 15
            };
        }
        
        // Test with the default values
        const testResult = validatePIPayment(1995, 350000, 6.5, 25);
        
        document.getElementById('results').innerHTML = `
            <h2>Test Results:</h2>
            <p>User Payment: $1,995</p>
            <p>Calculated P&I: $${testResult.calculatedPI.toFixed(2)}</p>
            <p>Difference: ${testResult.percentDifference.toFixed(1)}%</p>
            <p>Is Reasonable: ${testResult.isReasonable}</p>
        `;
        
        console.log('Test result:', testResult);
    </script>
</body>
</html>
